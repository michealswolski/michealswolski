name: Refresh profile art

on:
  schedule:
    # once a day, a little after midnight UTC
    - cron: "17 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Only one run at a time; a queued run supersedes an older one.
concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Start from whatever is already published. If a later step fails we then
      # republish the last good art unchanged, rather than clobbering working
      # cards with placeholders over a transient API blip.
      - name: Seed from the currently published art
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin output 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C dist
            echo "seeded from output branch:"; ls -1 dist
          else
            echo "no output branch yet — first run"
          fi

      - name: Render GitHub activity cards
        id: cards
        continue-on-error: true
        env:
          # A classic PAT with read:user if the repo defines one; the default
          # workflow token is an App installation token and often cannot read
          # contributionsCollection.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node tools/build_cards.mjs dist

      - name: Keep last good cards, or place holders on a first run
        if: steps.cards.outcome == 'failure'
        run: |
          echo "::warning::Card generation failed. If this persists, add a repository secret PROFILE_TOKEN holding a classic PAT with the read:user scope — the default GITHUB_TOKEN often cannot read contributionsCollection."
          if [ -f dist/stats.svg ]; then
            echo "republishing the previously generated cards unchanged"
          else
            echo "nothing published yet — writing placeholders so the README URLs resolve"
            node tools/build_cards.mjs dist --fallback
          fi

      - name: Render the contribution graph as a snake game
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Palettes match the README: cyan/teal on dark, deep cyan on light.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0A1526,#0E7490,#0891B2,#22D3EE,#67E8F9
            dist/snake-light.svg?palette=github-light&color_snake=#0E7490&color_dots=#EAF3FA,#BAE6FD,#38BDF8,#0891B2,#0E7490

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
