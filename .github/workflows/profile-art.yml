name: Refresh profile art

on:
  schedule:
    # once a day, a little after midnight UTC
    - cron: "17 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Only one run at a time; a queued run supersedes an older one.
concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Runs before the publish step on purpose: if the API call fails the job
      # stops here and the `output` branch keeps its last good art, rather than
      # publishing a half-built set and breaking images on the profile.
      - name: Render GitHub activity cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node tools/build_cards.mjs dist

      - name: Render the contribution graph as a snake game
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Palettes match the README: cyan/teal on dark, deep cyan on light.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0A1526,#0E7490,#0891B2,#22D3EE,#67E8F9
            dist/snake-light.svg?palette=github-light&color_snake=#0E7490&color_dots=#EAF3FA,#BAE6FD,#38BDF8,#0891B2,#0E7490

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
