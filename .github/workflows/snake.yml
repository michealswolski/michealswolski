name: Generate profile graphics

on:
  schedule:
    # once a day, a little after midnight UTC
    - cron: "17 0 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one run at a time; a queued run supersedes an older one.
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on pull requests too, and publishes nothing. The README points at
  # generated cards on the output branch, so a bug in the generator would only
  # surface after merge — as the broken images this whole setup exists to fix.
  # This exercises both generators before that can happen.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render the stat cards from fixture data
        run: python3 tools/build_stats.py /tmp/cards --fixture

      - name: Regenerate the committed assets
        run: python3 tools/build_assets.py assets

      - name: Every generated SVG must be well-formed
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom
          files = sorted(glob.glob('/tmp/cards/*.svg') + glob.glob('assets/*.svg'))
          assert files, 'no SVGs were generated'
          for path in files:
              xml.dom.minidom.parse(path)
          print(f'{len(files)} SVGs parsed')
          PY

      # If this fails, a committed SVG was hand-edited and the generator is no
      # longer the source of truth for it.
      - name: Committed assets must match the generator
        run: git diff --exit-code -- assets/

      - name: README must not reference third-party widget hosts
        run: |
          if grep -nE 'vercel\.app|demolab\.com' README.md; then
            echo "::error::README references a third-party widget host again"
            exit 1
          fi
          echo "no third-party widget hosts in README"

  publish:
    # Never on pull requests: forks can't hold the write permission, and a PR
    # has no business rewriting the output branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render the contribution graph as a snake game
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Palettes match the README: cyan/teal on dark, deep cyan on light.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0A1526,#0E7490,#0891B2,#22D3EE,#67E8F9
            dist/snake-light.svg?palette=github-light&color_snake=#0E7490&color_dots=#EAF3FA,#BAE6FD,#38BDF8,#0891B2,#0E7490

      # Platane/snk is a Docker action, so it runs as root and leaves dist/
      # owned by root. Everything after it runs as the unprivileged runner user
      # and cannot write there — which is exactly how the first live run failed,
      # with PermissionError on dist/stats.svg.
      - name: Hand dist/ back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" dist

      # Runs after the snake so both sets of graphics land in the same dist/.
      # If the GitHub API can't be reached this step exits non-zero, the publish
      # step below is skipped, and the previously published cards stay live —
      # stale numbers beat broken images.
      - name: Build the stat cards
        run: python3 tools/build_stats.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The README references every one of these by name. Publishing a dist/
      # that is missing any of them replaces good images with 404s, so this
      # fails loudly rather than shipping a partial set.
      - name: Every file the README references must exist
        run: |
          missing=0
          for f in snake-dark.svg snake-light.svg \
                   stats.svg stats-light.svg \
                   languages.svg languages-light.svg \
                   focus.svg focus-light.svg; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::dist/$f is missing or empty"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all 8 graphics present"
          ls -l dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
