<svg xmlns="http://www.w3.org/2000/svg" width="155" height="64" viewBox="0 0 155 64" role="img" aria-label="About">
  <title>About</title>
  <defs>
    <linearGradient id="hdEdge" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0E7490" stop-opacity="0.85"/><stop offset="100%" stop-color="#0E7490" stop-opacity="0.15"/></linearGradient>
    <linearGradient id="hdSheen" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0E7490" stop-opacity="0"/><stop offset="50%" stop-color="#0E7490" stop-opacity="0.18"/><stop offset="100%" stop-color="#0E7490" stop-opacity="0"/></linearGradient>
    <clipPath id="hdClip"><rect width="155" height="64" rx="14"/></clipPath>
  </defs>
  <style>
    .sheen{animation:sheen 6.5s ease-in-out infinite}
    .dot{animation:dot 3s ease-in-out infinite}
    @keyframes sheen{0%{transform:translateX(-155px)}55%,100%{transform:translateX(155px)}}
    @keyframes dot{0%,100%{opacity:.3}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.sheen,.dot{animation:none}.sheen{opacity:0}}
  </style>
  <g clip-path="url(#hdClip)">
    <rect width="155" height="64" fill="#FFFFFF" fill-opacity="0.82"/>
    <rect class="sheen" width="155" height="64" fill="url(#hdSheen)"/>
    <rect x="0" y="0" width="5" height="64" fill="#0E7490"/>
  </g>
  <rect x="1" y="1" width="153" height="62" rx="13" fill="none" stroke="url(#hdEdge)" stroke-width="1.4"/>
  <g transform="translate(34,32.0)"><g fill="none" stroke="#0E7490" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-5" r="4.6"/><path d="M-8.5 9.5c0-4.7 3.8-7.6 8.5-7.6s8.5 2.9 8.5 7.6"/></g></g>
  <text x="58" y="40.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">About</text>
  <circle class="dot" cx="133" cy="32.0" r="3.4" fill="#0E7490"/>
</svg>
