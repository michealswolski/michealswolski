<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Micheal Wolski — Cybersecurity Engineer. AI agent security, automotive and embedded security, full-stack development.">
  <title>Micheal Wolski — Cybersecurity Engineer</title>
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#050B16"/><stop offset="52%" stop-color="#0A1526"/><stop offset="100%" stop-color="#0F1F35"/></linearGradient>
    <linearGradient id="hName" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#67E8F9"/><stop offset="48%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#34D399"/><animate attributeName="x1" values="-40%;60%;-40%" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="60%;160%;60%" dur="9s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="hEdge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/><stop offset="50%" stop-color="#3B82F6" stop-opacity="0.45"/><stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/></linearGradient>
    <linearGradient id="hRule" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#34D399" stop-opacity="0"/></linearGradient>
    <linearGradient id="hScan" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#67E8F9" stop-opacity="0"/><stop offset="50%" stop-color="#67E8F9" stop-opacity="0.40"/><stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/></linearGradient>
    <linearGradient id="hSweep" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <radialGradient id="hOrbC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.50"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="hOrbG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#34D399" stop-opacity="0.50"/><stop offset="100%" stop-color="#34D399" stop-opacity="0"/></radialGradient>
    <radialGradient id="hOrbB" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3B82F6" stop-opacity="0.50"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <pattern id="hGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#3B82F6" stroke-opacity="0.075" stroke-width="1"/></pattern>
    <filter id="hGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="hCard"><rect width="1280" height="440" rx="24"/></clipPath>
    <clipPath id="hWaveClip"><rect x="0" y="0" width="216" height="30"/></clipPath>
  </defs>
  <style>
    .fade{animation:fadeIn .7s ease-out backwards}
    .type{animation:type 1.45s steps(24,end) .35s backwards}
    .wipe{animation:wipe .95s cubic-bezier(.16,.9,.24,1) 2.05s backwards}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow .8s cubic-bezier(.16,.9,.24,1) 2.75s backwards}
    .drift-a{animation:driftA 13s ease-in-out infinite}
    .drift-b{animation:driftB 17s ease-in-out infinite}
    .drift-c{animation:driftC 11s ease-in-out infinite}
    .grid-pan{animation:gridPan 22s linear infinite}
    .scan{animation:scan 7.5s cubic-bezier(.5,0,.5,1) infinite}
    .spark{animation:spark 6s ease-in-out infinite}
    .role{animation:role 17.6s linear infinite}
    .ring-cw{transform-box:view-box;transform-origin:1058px 182px;animation:spin 26s linear infinite}
    .ring-ccw{transform-box:view-box;transform-origin:1058px 182px;animation:spinBack 34s linear infinite}
    .radar{transform-box:view-box;transform-origin:1058px 182px;animation:spin 4.6s linear infinite}
    .beat{animation:beat 2.6s ease-in-out infinite}
    .caret{animation:blink 1.06s steps(1,end) 1.8s infinite}
    .wave{animation:wave 5.5s linear infinite}
    .live{animation:live 2.2s ease-in-out infinite}
    @keyframes fadeIn{from{opacity:0}}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-20px)}}
    @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,18px)}}
    @keyframes driftC{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,24px)}}
    @keyframes gridPan{to{transform:translate(-40px,-40px)}}
    @keyframes scan{0%{transform:translateY(-90px);opacity:1}100%{transform:translateY(530px);opacity:1}}
    @keyframes spark{0%{opacity:0;transform:translateY(0)}18%{opacity:.85}100%{opacity:0;transform:translateY(-96px)}}
    @keyframes role{0%,1%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinBack{to{transform:rotate(-360deg)}}
    @keyframes beat{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes wave{to{transform:translateX(-216px)}}
    @keyframes live{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      .fade,.type,.wipe,.grow,.drift-a,.drift-b,.drift-c,.grid-pan,.scan,.spark,.ring-cw,.ring-ccw,.radar,.beat,.caret,.wave,.live,.role{animation:none}
    }
  </style>
