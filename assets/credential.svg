    <path d="M-10 5 C-10 56 -15 92 -7 132 L7 132 C15 92 10 56 10 5 Z" fill="url(#cStrap)"/>
    <path d="M-10 5 C-10 56 -15 92 -7 132 L7 132 C15 92 10 56 10 5 Z" fill="url(#cWeave)"/>
    <text x="0" y="48" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="7.5" letter-spacing="1.1" fill="#F0FDFF" opacity="0.92" transform="rotate(90 0 48)">AUTHORIZED</text>
    <text x="0" y="104" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="7.5" letter-spacing="1.1" fill="#F0FDFF" opacity="0.92" transform="rotate(90 0 104)">AUTHORIZED</text>
