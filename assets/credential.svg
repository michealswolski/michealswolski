          <text x="-96" y="267" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="600" fill="#E2E8F0">ACTIVE</text>
        </g>
        <g class="rise" style="animation-delay:0.81s">
