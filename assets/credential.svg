<svg xmlns="http://www.w3.org/2000/svg" width="460" height="580" viewBox="0 0 460 580" role="img" aria-label="Security credential badge for Micheal Wolski, Cybersecurity Engineer">
  <title>Micheal Wolski — security credential</title>
  <defs>
    <linearGradient id="cStrap" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#34D399"/></linearGradient>
    <linearGradient id="cCard" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0A1526"/><stop offset="100%" stop-color="#0F1F35"/></linearGradient>
    <linearGradient id="cEdge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22D3EE"/><stop offset="55%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#34D399"/></linearGradient>
    <linearGradient id="cHolo" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.26"/><stop offset="58%" stop-color="#67E8F9" stop-opacity="0.26"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="cHalo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.34"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="cWeave" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#050B16" stroke-opacity="0.30" stroke-width="2"/></pattern>
    <clipPath id="cCardClip"><rect x="-118" y="0" width="236" height="366" rx="20"/></clipPath>
  </defs>
  <style>
    .swing{animation:settle 4.2s cubic-bezier(.33,0,.2,1) both, sway 6s ease-in-out 4.2s infinite}
    .holo{animation:holo 6.5s ease-in-out infinite}
    .breathe{animation:breathe 4.5s ease-in-out infinite}
    .led{animation:led 2s ease-in-out infinite}
    .scanbar{animation:scanbar 3.4s ease-in-out infinite}
    .chipflow{stroke-dasharray:5 7;animation:chipflow 2.4s linear infinite}
    .rise{animation:rise .6s ease-out backwards}
    @keyframes settle{0%{transform:translate(230px,16px) rotate(11deg)}28%{transform:translate(230px,16px) rotate(-7.5deg)}52%{transform:translate(230px,16px) rotate(4.6deg)}72%{transform:translate(230px,16px) rotate(-2.6deg)}88%{transform:translate(230px,16px) rotate(1.2deg)}100%{transform:translate(230px,16px) rotate(-5deg)}}
    @keyframes sway{0%,100%{transform:translate(230px,16px) rotate(-5deg)}25%{transform:translate(230px,20px) rotate(0deg)}50%{transform:translate(230px,16px) rotate(5deg)}75%{transform:translate(230px,20px) rotate(0deg)}}
    @keyframes holo{0%{transform:translate(-300px,-300px);opacity:1}55%,100%{transform:translate(300px,300px);opacity:1}}
    @keyframes led{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes breathe{0%,100%{opacity:.18}50%{opacity:.5}}
    @keyframes scanbar{0%,100%{transform:translateX(0);opacity:0}10%{opacity:.9}50%{transform:translateX(146px);opacity:.9}60%{opacity:0}}
    @keyframes chipflow{to{stroke-dashoffset:-24}}
    @keyframes rise{from{opacity:0;transform:translateY(9px)}}
    @media (prefers-reduced-motion: reduce){
      .swing,.holo,.led,.scanbar,.chipflow,.rise,.breathe{animation:none}
    }
  </style>
  <g class="swing" transform="translate(230,16)">
