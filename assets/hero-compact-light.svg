<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-label="Micheal Wolski — Cybersecurity Engineer. AI agent security, automotive and embedded security, full-stack development.">
  <title>Micheal Wolski — Cybersecurity Engineer</title>
  <defs>
    <linearGradient id="oBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F7FBFE"/><stop offset="52%" stop-color="#EAF3FA"/><stop offset="100%" stop-color="#DDEBF6"/></linearGradient>
    <linearGradient id="oName" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0891B2"/><stop offset="48%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#047857"/><animate attributeName="x1" values="-40%;60%;-40%" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="60%;160%;60%" dur="9s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="oEdge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0E7490" stop-opacity="0.85"/><stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.45"/><stop offset="100%" stop-color="#047857" stop-opacity="0.8"/></linearGradient>
    <linearGradient id="oRule" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0E7490" stop-opacity="0"/><stop offset="50%" stop-color="#0E7490"/><stop offset="100%" stop-color="#047857" stop-opacity="0"/></linearGradient>
    <linearGradient id="oSweep" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0E7490" stop-opacity="0.30"/><stop offset="100%" stop-color="#0E7490" stop-opacity="0"/></linearGradient>
    <radialGradient id="oOrbC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0E7490" stop-opacity="0.26"/><stop offset="100%" stop-color="#0E7490" stop-opacity="0"/></radialGradient>
    <radialGradient id="oOrbG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#047857" stop-opacity="0.26"/><stop offset="100%" stop-color="#047857" stop-opacity="0"/></radialGradient>
    <pattern id="oGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#0E7490" stroke-opacity="0.10" stroke-width="1"/></pattern>
    <filter id="oGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="oBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="oCard"><rect width="720" height="620" rx="22"/></clipPath>
  </defs>
  <style>
    .fade{animation:fadeIn .7s ease-out backwards}
    .type{animation:type 1.3s steps(21,end) .35s backwards}
    .wipe{animation:wipe .9s cubic-bezier(.16,.9,.24,1) 1.9s backwards}
    .grow{transform-box:fill-box;transform-origin:center;animation:grow .8s cubic-bezier(.16,.9,.24,1) 2.5s backwards}
    .drift-a{animation:driftA 13s ease-in-out infinite}
    .drift-b{animation:driftB 17s ease-in-out infinite}
    .grid-pan{animation:gridPan 22s linear infinite}
    .role{animation:role 17.6s linear infinite}
    .ring-cw{transform-box:view-box;transform-origin:360px 178px;animation:spin 26s linear infinite}
    .ring-ccw{transform-box:view-box;transform-origin:360px 178px;animation:spinBack 34s linear infinite}
    .radar{transform-box:view-box;transform-origin:360px 178px;animation:spin 4.6s linear infinite}
    .beat{animation:beat 2.6s ease-in-out infinite}
    .caret{animation:blink 1.06s steps(1,end) 1.65s infinite}
    .live{animation:live 2.2s ease-in-out infinite}
    @keyframes fadeIn{from{opacity:0}}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-16px)}}
    @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,14px)}}
    @keyframes gridPan{to{transform:translate(-40px,-40px)}}
    @keyframes role{0%,1%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinBack{to{transform:rotate(-360deg)}}
    @keyframes beat{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes live{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      .fade,.type,.wipe,.grow,.drift-a,.drift-b,.grid-pan,.role,.ring-cw,.ring-ccw,.radar,.beat,.caret,.live{animation:none}
    }
  </style>
  <g clip-path="url(#oCard)">
    <rect width="720" height="620" fill="url(#oBg)"/>
    <g class="grid-pan"><rect x="-40" y="-40" width="800" height="700" fill="url(#oGrid)"/></g>
    <g filter="url(#oBlur)">
      <circle class="drift-a" cx="360" cy="178" r="150" fill="url(#oOrbC)"/>
      <circle class="drift-b" cx="360" cy="560" r="150" fill="url(#oOrbG)"/>
    </g>
    <g font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace">
      <rect x="40" y="30" width="640" height="44" rx="11" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="64" cy="52" r="5" fill="#FF5F57"/>
      <circle cx="82" cy="52" r="5" fill="#FEBC2E"/>
      <circle cx="100" cy="52" r="5" fill="#28C840"/>
      <text x="124" y="59" font-size="19" fill="#047857">$</text>
      <g class="type">
        <text x="142" y="59" font-size="19" fill="#1E293B">./whoami --scope full</text>
      </g>
      <rect class="caret" x="381" y="45" width="10" height="19" fill="#0E7490" opacity="0"/>
    </g>
    <g>
      <circle class="ring-cw" cx="360" cy="178" r="78" fill="none" stroke="#0E7490" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="3 10"/>
      <circle class="ring-ccw" cx="360" cy="178" r="64" fill="none" stroke="#1D4ED8" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="20 11"/>
      <circle cx="360" cy="178" r="50" fill="none" stroke="#047857" stroke-opacity="0.26" stroke-width="1"/>
      <path class="radar" d="M360 178 L438 150 A78 78 0 0 1 438 206 Z" fill="url(#oSweep)"/>
      <g class="ring-cw">
        <circle cx="438" cy="178" r="3.6" fill="#0E7490"/>
        <circle cx="321" cy="246" r="3.6" fill="#047857"/>
        <circle cx="321" cy="110" r="3.6" fill="#1D4ED8"/>
      </g>
      <path d="M360 138 L394 158 L394 198 L360 218 L326 198 L326 158 Z" fill="#FFFFFF" fill-opacity="0.82" stroke="url(#oEdge)" stroke-width="1.6"/>
      <path class="beat" d="M360 138 L394 158 L394 198 L360 218 L326 198 L326 158 Z" fill="none" stroke="#0E7490" stroke-width="5" stroke-opacity="0.16"/>
      <path d="M350 173 v-6.5 a10 10 0 0 1 20 0 v6.5" fill="none" stroke="#0891B2" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="344" y="173" width="32" height="25" rx="5" fill="none" stroke="#0891B2" stroke-width="2.2"/>
      <circle cx="360" cy="182" r="2.6" fill="#047857"/>
      <path d="M360 184 v5" stroke="#047857" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g class="wipe">
      <text x="360" y="318" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.4" fill="url(#oName)" filter="url(#oGlow)">MICHEAL WOLSKI</text>
    </g>
    <rect class="grow" x="250" y="332" width="220" height="3.5" rx="1.75" fill="url(#oRule)"/>
    <g font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="21" fill="#475569">
      <text class="role" x="360" y="372" text-anchor="middle" opacity="1" style="animation-delay:3.0s"><tspan fill="#0E7490">&gt;</tspan> Cybersecurity Engineer</text>
      <text class="role" x="360" y="372" text-anchor="middle" opacity="0" style="animation-delay:7.4s"><tspan fill="#0E7490">&gt;</tspan> AI Agent Security</text>
      <text class="role" x="360" y="372" text-anchor="middle" opacity="0" style="animation-delay:11.8s"><tspan fill="#0E7490">&gt;</tspan> Automotive &amp; Embedded</text>
      <text class="role" x="360" y="372" text-anchor="middle" opacity="0" style="animation-delay:16.2s"><tspan fill="#0E7490">&gt;</tspan> Detection &amp; Response</text>
    </g>
    <g class="fade" style="animation-delay:2.8s">
      <rect x="70" y="394" width="580" height="46" rx="12" fill="#FFFFFF" fill-opacity="0.82" stroke="#0E7490" stroke-opacity="0.28" stroke-width="1"/>
      <text x="360" y="423" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#1E293B">Security that survives contact with production.</text>
    </g>
    <g class="fade" style="animation-delay:3.05s">
      <rect x="106.0" y="458" width="154.4" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="125.0" cy="476" r="3.6" fill="#0E7490"/>
      <text x="138.0" y="482" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#1E293B">AI Security</text>
    </g>
    <g class="fade" style="animation-delay:3.14s">
      <rect x="272.4" y="458" width="196.0" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="291.4" cy="476" r="3.6" fill="#047857"/>
      <text x="304.4" y="482" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#1E293B">Threat Modeling</text>
    </g>
    <g class="fade" style="animation-delay:3.23s">
      <rect x="480.4" y="458" width="133.6" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="499.4" cy="476" r="3.6" fill="#1D4ED8"/>
      <text x="512.4" y="482" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#1E293B">CAN / UDS</text>
    </g>
    <g class="fade" style="animation-delay:3.25s">
      <rect x="178.8" y="502" width="154.4" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="197.8" cy="520" r="3.6" fill="#0E7490"/>
      <text x="210.8" y="526" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#1E293B">Secure Boot</text>
    </g>
    <g class="fade" style="animation-delay:3.34s">
      <rect x="345.2" y="502" width="81.6" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="364.2" cy="520" r="3.6" fill="#047857"/>
      <text x="377.2" y="526" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#1E293B">SIEM</text>
    </g>
    <g class="fade" style="animation-delay:3.43s">
      <rect x="438.8" y="502" width="102.4" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="457.8" cy="520" r="3.6" fill="#1D4ED8"/>
      <text x="470.8" y="526" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#1E293B">Python</text>
    </g>
    <g class="fade" style="animation-delay:3.4s">
      <rect x="70" y="548" width="580" height="60" rx="13" fill="#FFFFFF" fill-opacity="0.82" stroke="#CBD5E1" stroke-width="1"/>
      <circle class="live" cx="184" cy="570" r="5" fill="#047857"/>
      <text x="368" y="576" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="20"><tspan fill="#047857">OPEN TO WORK</tspan><tspan fill="#475569"> · Michigan, USA</tspan></text>
      <text x="360" y="600" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#64748B">B.S. Information Assurance &amp; Cyber Defense · EMU</text>
    </g>
  </g>
  <rect x="1" y="1" width="718" height="618" rx="21" fill="none" stroke="url(#oEdge)" stroke-width="1.6"/>
</svg>
