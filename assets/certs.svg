<svg xmlns="http://www.w3.org/2000/svg" width="600" height="162" viewBox="0 0 600 162" role="img" aria-label="Certifications">
  <title>Certifications</title>
  <defs>
    <clipPath id="cTile"><rect width="276" height="138" rx="14"/></clipPath>
    <linearGradient id="cEdge0" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0.14"/></linearGradient>
    <linearGradient id="cSheen0" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/><stop offset="50%" stop-color="#3B82F6" stop-opacity="0.16"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
    <linearGradient id="cEdge1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/><stop offset="100%" stop-color="#34D399" stop-opacity="0.14"/></linearGradient>
    <linearGradient id="cSheen1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#34D399" stop-opacity="0"/><stop offset="50%" stop-color="#34D399" stop-opacity="0.16"/><stop offset="100%" stop-color="#34D399" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .tile{animation:cIn .75s cubic-bezier(.2,.7,.3,1) backwards}
    .sheen{animation:cSheen 7s ease-in-out infinite}
    .ring{animation:cSpin 18s linear infinite}
    .pip{animation:cPip 3s ease-in-out infinite}
    .t0{animation-delay:0.08s}.s0{animation-delay:0.00s}.r0{animation-delay:-0.0s}.p0{animation-delay:0.00s}
    .t1{animation-delay:0.22s}.s1{animation-delay:1.10s}.r1{animation-delay:-2.4s}.p1{animation-delay:0.50s}
    @keyframes cIn{from{opacity:0;transform:translateY(14px)}}
    @keyframes cSheen{0%{transform:translateX(-276px)}55%,100%{transform:translateX(276px)}}
    @keyframes cSpin{to{transform:rotate(360deg)}}
    @keyframes cPip{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      .tile,.sheen,.ring,.pip{animation:none}.sheen{opacity:0}
    }
  </style>
  <g transform="translate(12,12)">
    <g class="tile t0">
      <g clip-path="url(#cTile)">
        <rect width="276" height="138" fill="#0B1526" fill-opacity="0.72"/>
        <rect class="sheen s0" width="276" height="138" fill="url(#cSheen0)"/>
        <rect width="5" height="138" fill="#3B82F6"/>
      </g>
      <rect x="1" y="1" width="274" height="136" rx="13" fill="none" stroke="url(#cEdge0)" stroke-width="1.4"/>
      <g transform="translate(42,44)">
        <g class="ring r0"><circle r="15.5" fill="none" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="5 4.5"/></g>
        <circle r="10.8" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.1"/>
        <g fill="none" stroke="#3B82F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-5.6 -4.2h3.9a2.3 2.3 0 0 1 0 4.6h-4.3a2.3 2.3 0 0 0 0 4.6h3.9"/><circle cx="-5.6" cy="-4.2" r="1.4"/><circle cx="5.2" cy="5" r="1.4"/><path d="M0.5 5h3.3"/></g>
      </g>
      <text x="74" y="40" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">CCNA</text>
      <text x="74" y="60" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94A3B8">Cisco Networking Academy</text>
      <path d="M22 86H254" stroke="#1E293B" stroke-width="1"/>
      <circle class="pip p0" cx="30" cy="108" r="3.6" fill="#3B82F6"/>
      <text x="43" y="112" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="1.6" fill="#64748B">NETWORKING</text>
    </g>
  </g>
  <g transform="translate(312,12)">
    <g class="tile t1">
      <g clip-path="url(#cTile)">
        <rect width="276" height="138" fill="#0B1526" fill-opacity="0.72"/>
        <rect class="sheen s1" width="276" height="138" fill="url(#cSheen1)"/>
        <rect width="5" height="138" fill="#34D399"/>
      </g>
      <rect x="1" y="1" width="274" height="136" rx="13" fill="none" stroke="url(#cEdge1)" stroke-width="1.4"/>
      <g transform="translate(42,44)">
        <g class="ring r1"><circle r="15.5" fill="none" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="5 4.5"/></g>
        <circle r="10.8" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.1"/>
        <g fill="none" stroke="#34D399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-6 0.6v-1.2a6 6 0 0 1 12 0v1.2"/><path d="M-6 -0.4h1.5v4.2h-1.5ZM4.5 -0.4h1.5v4.2h-1.5Z"/><path d="M6 3.8v0.8a1.9 1.9 0 0 1 -1.9 1.9h-2"/></g>
      </g>
      <text x="74" y="40" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">IT Help Desk</text>
      <text x="74" y="60" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#94A3B8">IT support &amp; troubleshooting</text>
      <path d="M22 86H254" stroke="#1E293B" stroke-width="1"/>
      <circle class="pip p1" cx="30" cy="108" r="3.6" fill="#34D399"/>
      <text x="43" y="112" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="1.6" fill="#64748B">IT SUPPORT</text>
    </g>
  </g>
</svg>
