<svg xmlns="http://www.w3.org/2000/svg" width="900" height="286" viewBox="0 0 900 286" role="img" aria-label="Automotive and embedded work on one side, AI agent and software work on the other, both validated by the same discipline.">
  <title>Two domains, one discipline</title>
  <defs>
    <linearGradient id="dmBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F7FBFE"/><stop offset="50%" stop-color="#EAF3FA"/><stop offset="100%" stop-color="#DDEBF6"/></linearGradient>
    <linearGradient id="dmEdge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#B45309" stop-opacity="0.75"/><stop offset="50%" stop-color="#0E7490" stop-opacity="0.5"/><stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.75"/></linearGradient>
    <linearGradient id="dmLaneL" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#B45309" stop-opacity="0"/><stop offset="100%" stop-color="#B45309" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="dmLaneR" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.55"/><stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/></linearGradient>
    <radialGradient id="dmHalo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0E7490" stop-opacity="0.4"/><stop offset="100%" stop-color="#0E7490" stop-opacity="0"/></radialGradient>
    <pattern id="dmGrid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#0E7490" stroke-opacity="0.10" stroke-width="1"/></pattern>
    <clipPath id="dmCard"><rect width="900" height="286" rx="18"/></clipPath>
  </defs>
  <style>
    .pkt{animation:runR 3.6s linear infinite}
    .tok{animation:runL 3.6s linear infinite}
    .pulse{animation:pulse 3.6s ease-in-out infinite}
    .fade{animation:fadeIn .7s ease-out backwards}
    @keyframes runR{0%{transform:translateX(0);opacity:0}12%{opacity:1}82%{opacity:1}100%{transform:translateX(268px);opacity:0}}
    @keyframes runL{0%{transform:translateX(0);opacity:0}12%{opacity:1}82%{opacity:1}100%{transform:translateX(-268px);opacity:0}}
    @keyframes pulse{0%,100%{opacity:.30}46%{opacity:.95}}
    @keyframes fadeIn{from{opacity:0}}
    @media (prefers-reduced-motion: reduce){
      .pkt,.tok,.pulse,.fade{animation:none}.pkt,.tok{opacity:.85}
    }
  </style>
  <g clip-path="url(#dmCard)">
    <rect width="900" height="286" fill="url(#dmBg)"/>
    <rect width="900" height="286" fill="url(#dmGrid)"/>
    <rect x="86" y="131" width="286" height="2" fill="url(#dmLaneL)"/>
    <rect x="528" y="131" width="286" height="2" fill="url(#dmLaneR)"/>
    <g class="pkt" style="animation-delay:0.0s"><rect x="86" y="127" width="16" height="10" rx="2.5" fill="#B45309"/></g>
    <g class="tok" style="animation-delay:0.36s"><circle cx="814" cy="132" r="5" fill="#1D4ED8"/></g>
    <g class="pkt" style="animation-delay:0.72s"><rect x="86" y="127" width="16" height="10" rx="2.5" fill="#B45309"/></g>
    <g class="tok" style="animation-delay:1.08s"><circle cx="814" cy="132" r="5" fill="#1D4ED8"/></g>
    <g class="pkt" style="animation-delay:1.44s"><rect x="86" y="127" width="16" height="10" rx="2.5" fill="#B45309"/></g>
    <g class="tok" style="animation-delay:1.8s"><circle cx="814" cy="132" r="5" fill="#1D4ED8"/></g>
    <g class="pkt" style="animation-delay:2.16s"><rect x="86" y="127" width="16" height="10" rx="2.5" fill="#B45309"/></g>
    <g class="tok" style="animation-delay:2.52s"><circle cx="814" cy="132" r="5" fill="#1D4ED8"/></g>
    <g class="pkt" style="animation-delay:2.88s"><rect x="86" y="127" width="16" height="10" rx="2.5" fill="#B45309"/></g>
    <g class="tok" style="animation-delay:3.24s"><circle cx="814" cy="132" r="5" fill="#1D4ED8"/></g>
    <g class="fade" style="animation-delay:.1s">
      <rect x="30" y="98" width="58" height="68" rx="11" fill="#FFFFFF" fill-opacity="0.82" stroke="#B45309" stroke-opacity="0.6" stroke-width="1.4"/>
      <rect x="46" y="116" width="26" height="32" rx="4" fill="none" stroke="#B45309" stroke-width="1.8"/>
      <path d="M38 123h8M72 123h8" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M38 131h8M72 131h8" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M38 139h8M72 139h8" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/>
      <text x="59" y="84" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.2" fill="#B45309">ECU</text>
    </g>
    <text x="30" y="206" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Automotive &amp; Embedded</text>
    <text x="30" y="228" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#475569">CAN · UDS · secure boot · TPM</text>
    <g class="fade" style="animation-delay:.2s">
      <rect x="812" y="98" width="58" height="68" rx="11" fill="#FFFFFF" fill-opacity="0.82" stroke="#1D4ED8" stroke-opacity="0.6" stroke-width="1.4"/>
      <circle cx="841" cy="122" r="5.5" fill="none" stroke="#1D4ED8" stroke-width="1.8"/>
      <circle cx="830" cy="143" r="4.5" fill="none" stroke="#1D4ED8" stroke-width="1.8"/>
      <circle cx="852" cy="143" r="4.5" fill="none" stroke="#1D4ED8" stroke-width="1.8"/>
      <path d="M837.5 126.5 833 138.5M844.5 126.5 849 138.5" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round"/>
      <text x="841" y="84" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.2" fill="#1D4ED8">AGENT</text>
    </g>
    <text x="870" y="206" text-anchor="end" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">AI Agents &amp; Software</text>
    <text x="870" y="228" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#475569">guardrails · audit trails · approvals</text>
    <circle cx="450" cy="132" r="74" fill="url(#dmHalo)"/>
    <path d="M450 80 L495 106 L495 158 L450 184 L405 158 L405 106 Z" fill="#FFFFFF" fill-opacity="0.82" stroke="url(#dmEdge)" stroke-width="1.8"/>
    <path class="pulse" d="M450 80 L495 106 L495 158 L450 184 L405 158 L405 106 Z" fill="none" stroke="#0E7490" stroke-width="7" stroke-opacity="0.30"/>
    <path d="M434 133 l11 11 l21 -22" fill="none" stroke="#047857" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="450" y="206" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.6" fill="#0E7490">VERIFY BEFORE TRUST</text>
    <line x1="30" y1="234" x2="870" y2="234" stroke="#CBD5E1" stroke-width="1"/>
    <text x="450" y="262" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1E293B">Two domains, one discipline — the threat model changes, the rigour does not.</text>
  </g>
  <rect x="1" y="1" width="898" height="284" rx="17" fill="none" stroke="url(#dmEdge)" stroke-width="1.4"/>
</svg>
