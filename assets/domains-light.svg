<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Five vehicle domains — telematics, ADAS, infotainment, body and chassis, and powertrain — each pinging a central verification gateway before anything is trusted.">
  <title>One gateway, five vehicle domains</title>
  <defs>
    <linearGradient id="dmBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F7FBFE"/><stop offset="50%" stop-color="#EAF3FA"/><stop offset="100%" stop-color="#DDEBF6"/></linearGradient>
    <linearGradient id="dmEdge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#B45309" stop-opacity="0.75"/><stop offset="50%" stop-color="#0E7490" stop-opacity="0.5"/><stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.75"/></linearGradient>
    <radialGradient id="dmHalo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0E7490" stop-opacity="0.38"/><stop offset="100%" stop-color="#0E7490" stop-opacity="0"/></radialGradient>
    <pattern id="dmGrid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#0E7490" stroke-opacity="0.10" stroke-width="1"/></pattern>
    <clipPath id="dmCard"><rect width="900" height="420" rx="18"/></clipPath>
  </defs>
  <style>
    .fade{animation:fadeIn .7s ease-out backwards}
    .ping{animation:ping 3.2s ease-in-out infinite}
    .pulse{animation:pulse 3.6s ease-in-out infinite}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
    @keyframes ping{0%{transform:translate(calc(var(--dx) * -1px),calc(var(--dy) * -1px));opacity:0}18%{opacity:1}50%{transform:translate(0,0);opacity:1}82%{opacity:1}100%{transform:translate(calc(var(--dx) * 1px),calc(var(--dy) * 1px));opacity:0}}
    @keyframes pulse{0%,100%{opacity:.30}46%{opacity:.95}}
    @media (prefers-reduced-motion: reduce){
      .fade,.ping,.pulse{animation:none}
    }
  </style>
  <g clip-path="url(#dmCard)">
    <rect width="900" height="420" fill="url(#dmBg)"/>
    <rect width="900" height="420" fill="url(#dmGrid)"/>
    <line x1="450.0" y1="96.0" x2="450" y2="214" stroke="#1D4ED8" stroke-opacity="0.32" stroke-width="1.6"/>
    <line x1="630.7" y1="177.5" x2="450" y2="214" stroke="#0E7490" stroke-opacity="0.32" stroke-width="1.6"/>
    <line x1="561.7" y1="309.5" x2="450" y2="214" stroke="#047857" stroke-opacity="0.32" stroke-width="1.6"/>
    <line x1="338.3" y1="309.5" x2="450" y2="214" stroke="#B45309" stroke-opacity="0.32" stroke-width="1.6"/>
    <line x1="269.3" y1="177.5" x2="450" y2="214" stroke="#0E7490" stroke-opacity="0.32" stroke-width="1.6"/>
    <circle class="ping" cx="450.0" cy="155.0" r="4" fill="#1D4ED8" style="--dx:0.0;--dy:59.0;animation-delay:0.0s"/>
    <circle class="ping" cx="540.4" cy="195.8" r="4" fill="#0E7490" style="--dx:-90.4;--dy:18.2;animation-delay:0.58s"/>
    <circle class="ping" cx="505.8" cy="261.7" r="4" fill="#047857" style="--dx:-55.8;--dy:-47.7;animation-delay:1.16s"/>
    <circle class="ping" cx="394.2" cy="261.7" r="4" fill="#B45309" style="--dx:55.8;--dy:-47.7;animation-delay:1.74s"/>
    <circle class="ping" cx="359.6" cy="195.8" r="4" fill="#0E7490" style="--dx:90.4;--dy:18.2;animation-delay:2.32s"/>
    <g class="fade" style="animation-delay:0.1s">
      <circle cx="450.0" cy="96.0" r="27" fill="#FFFFFF" fill-opacity="0.82" stroke="#1D4ED8" stroke-opacity="0.7" stroke-width="1.6"/>
      <g transform="translate(450.0,96.0)" fill="none" stroke="#1D4ED8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-1.6 7a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0 -3.2 0 M-4.2 3a5.9 5.9 0 0 1 8.4 0 M-7.6 -0.6a10.4 10.4 0 0 1 15.2 0"/>
      </g>
      <text x="450.0" y="42.0" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Telematics</text>
      <text x="450.0" y="59.0" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#475569">cellular · OTA updates</text>
    </g>
    <g class="fade" style="animation-delay:0.18s">
      <circle cx="630.7" cy="177.5" r="27" fill="#FFFFFF" fill-opacity="0.82" stroke="#0E7490" stroke-opacity="0.7" stroke-width="1.6"/>
      <g transform="translate(630.7,177.5)" fill="none" stroke="#0E7490" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-8 2a8 8 0 0 1 16 0 M-1.8 2a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0 M-8 2h-2.4M8 2h2.4"/>
      </g>
      <text x="685.9" y="160.8" text-anchor="start" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">ADAS</text>
      <text x="685.9" y="177.8" text-anchor="start" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#475569">camera · radar fusion</text>
    </g>
    <g class="fade" style="animation-delay:0.26s">
      <circle cx="561.7" cy="309.5" r="27" fill="#FFFFFF" fill-opacity="0.82" stroke="#047857" stroke-opacity="0.7" stroke-width="1.6"/>
      <g transform="translate(561.7,309.5)" fill="none" stroke="#047857" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-8 -6h16v10.4h-16ZM-3 7.4h6"/>
      </g>
      <text x="595.8" y="353.2" text-anchor="start" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Infotainment</text>
      <text x="595.8" y="370.2" text-anchor="start" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#475569">SOME/IP · Bluetooth</text>
    </g>
    <g class="fade" style="animation-delay:0.34s">
      <circle cx="338.3" cy="309.5" r="27" fill="#FFFFFF" fill-opacity="0.82" stroke="#B45309" stroke-opacity="0.7" stroke-width="1.6"/>
      <g transform="translate(338.3,309.5)" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-7.4 -8h9.4a5 5 0 0 1 5 5v11h-14.4ZM-7.4 3h14.4M3 -1.2a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0 -2.6 0"/>
      </g>
      <text x="304.2" y="353.2" text-anchor="end" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Body &amp; Chassis</text>
      <text x="304.2" y="370.2" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#475569">LIN bus · CAN</text>
    </g>
    <g class="fade" style="animation-delay:0.42s">
      <circle cx="269.3" cy="177.5" r="27" fill="#FFFFFF" fill-opacity="0.82" stroke="#0E7490" stroke-opacity="0.7" stroke-width="1.6"/>
      <g transform="translate(269.3,177.5)" fill="none" stroke="#0E7490" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0M-2.6 0a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0 -5.2 0M7 0 10 0M3.5 6.06 5 8.66M-3.5 6.06 -5 8.66M-7 0 -10 0M-3.5 -6.06 -5 -8.66M3.5 -6.06 5 -8.66"/>
      </g>
      <text x="214.1" y="160.8" text-anchor="end" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Powertrain</text>
      <text x="214.1" y="177.8" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#475569">CAN-FD · UDS</text>
    </g>
    <circle cx="450" cy="214" r="92" fill="url(#dmHalo)"/>
    <path d="M450 162 L495 188 L495 240 L450 266 L405 240 L405 188 Z" fill="#FFFFFF" fill-opacity="0.82" stroke="url(#dmEdge)" stroke-width="1.8"/>
    <path class="pulse" d="M450 162 L495 188 L495 240 L450 266 L405 240 L405 188 Z" fill="none" stroke="#0E7490" stroke-width="7" stroke-opacity="0.30"/>
    <path d="M434 215 l11 11 l21 -22" fill="none" stroke="#047857" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="30" y1="380" x2="870" y2="380" stroke="#CBD5E1" stroke-width="1"/>
    <text x="450" y="404" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1E293B">One gateway, every domain — automotive network or API, nothing moves until it&#39;s verified.</text>
  </g>
  <rect x="1" y="1" width="898" height="418" rx="17" fill="none" stroke="url(#dmEdge)" stroke-width="1.4"/>
</svg>
